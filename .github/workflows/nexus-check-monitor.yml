name: Nexus CI monitor

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Nexus pull request number to inspect
        required: false
        default: '136'
        type: string
      required_checks:
        description: Optional comma-separated check names to treat as required
        required: false
        default: ''
        type: string
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: nexus-ci-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitor Nexus PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NEXUS_MONITOR_REPOSITORY: jonathanblunt1214-lgtm/Nexus-
      NEXUS_MONITOR_PR: ${{ inputs.pull_request || '136' }}
      NEXUS_MONITOR_REQUIRED_CHECKS: ${{ inputs.required_checks || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Run Nexus CI monitor
        id: monitor
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if node src/nexusCheckMonitor.js > artifacts/nexus-ci-monitor.json 2> artifacts/nexus-ci-monitor.error.log; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
            echo "The Crucible monitor observed Nexus blockers (exit $code)."
          fi
          node -e "const r=require('./artifacts/nexus-ci-monitor.json'); console.log(r.checks); console.log(r.blockers)"
      - name: Publish monitor summary
        if: always()
        env:
          REPORT: artifacts/nexus-ci-monitor.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const s = report.checks.counts;
          const lines = [
            '## Nexus CI monitor',
            '',
            `Repository: ${report.repository}`,
            `PR: #${report.pullRequest.number}`,
            `Head: \`${report.pullRequest.headSha}\``,
            `Mergeable: ${report.pullRequest.mergeable} (${report.pullRequest.mergeableState})`,
            '',
            `Checks: ${s.successful} successful, ${s.failing} failing, ${s.in_progress} in progress, ${s.queued} queued, ${s.skipped} skipped.`,
            '',
            report.blockers.length ? `### Blockers\n\n${report.blockers.map((b) => `- ${b}`).join('\n')}` : 'No blockers observed.',
            '',
            '### Non-green checks',
            '',
            ...['failing', 'in_progress', 'queued'].flatMap((state) => report.checks.groups[state].map((c) => `- **${state}** ${c.name}${c.conclusion ? ` (${c.conclusion})` : ''} — ${c.detailsUrl || 'no URL'}`)),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ci-monitor
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Fail the monitor when Nexus is not healthy
        if: steps.monitor.outputs.healthy != 'true'
        run: exit 1
