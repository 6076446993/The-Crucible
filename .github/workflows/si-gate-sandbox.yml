name: SI R3-R8 sandbox

on:
  push:
    branches:
      - development
    paths:
      - 'governingDocuments/synthetic-intelligence-research-register.json'
      - 'test/automatedModelPointerResearch.test.js'
      - 'test/safeInformationRetrieval.test.js'
      - 'src/automatedModelPointerResearch.js'
      - 'src/safeInformationRetrieval.js'
      - '.github/workflows/si-gate-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si-gate-sandbox-development
  cancel-in-progress: false

jobs:
  r3-si-discovery-sandbox:
    name: SI R3 discovery sandbox
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Exercise SI source seeds through the R3 admission sandbox
        run: node --test --test-name-pattern="SI R3 sandbox" test/automatedModelPointerResearch.test.js

  r8-si-safety-sandbox:
    name: SI R8 safety sandbox
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Exercise SI content through the R8 safety sandbox
        run: node --test --test-name-pattern="SI R8 sandbox" test/safeInformationRetrieval.test.js
