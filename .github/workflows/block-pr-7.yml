name: "Block locked monitoring PRs"

# PR #11 (ci-monitor -> main) is a permanent draft that exists solely as a
# live CI-monitoring event hook - see AGENTS.md's branch policy. It must
# never be merged, by any agent or by accident. Its predecessors: PR #7,
# merged directly by the repository owner; PR #9, auto-merged and
# auto-closed by GitHub with nobody touching its merge button, the moment
# its head (the `development` branch ref) became reachable from `main`
# through an unrelated promotion. Both are kept in the blocked list below
# purely as a historical safeguard (a merged PR cannot be reopened, so this
# can never actually trigger for either again) rather than removed and
# forgotten. This check reports failure only for a locked PR number and
# succeeds instantly for every other pull request. It also reports success
# on development pushes so an explicitly approved direct promotion carries
# a genuine passing required check.
#
# This file keeps its original name (block-pr-7.yml) even though it now
# protects PR #11 as well, per AGENTS.md's no-rename-without-being-asked
# rule. If PR #11 is ever replaced by a new monitoring PR, add its number
# to LOCKED_PR_NUMBERS below and update AGENTS.md's branch-policy section
# to name it - never remove an old number, only add the new one.
#
# Adding it as required is a one-time manual step in this repository's own
# Settings -> Branches -> Branch protection rules (no API this project's
# agents have access to can do it remotely): require this check, "block",
# to pass before merging into `main`. Until that step is done, this
# workflow reports the failure but does not yet block the merge button.
on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  block:
    runs-on: ubuntu-latest
    env:
      LOCKED_PR_NUMBERS: "7 9 11"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fail only for a locked, permanent CI-monitoring hook PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          number="${{ github.event.pull_request.number }}"
          for locked in $LOCKED_PR_NUMBERS; do
            if [ "$number" = "$locked" ]; then
              echo "PR #$number is a permanent CI-monitoring event hook and must never be merged. See AGENTS.md's branch policy." >&2
              exit 1
            fi
          done
      - name: Wait for the Crucible PR monitor aggregate gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha }}"
          deadline=$(( $(date +%s) + 660 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Monitor all Crucible-monitored PRs")] | sort_by(.id) | last | if . == null then "missing" elif .status != "completed" then "pending" elif .conclusion == "success" then "success" else "failure" end')"
            case "$state" in
              success) echo "Crucible PR monitor passed for $sha."; exit 0 ;;
              failure) echo "Crucible PR monitor failed for $sha." >&2; exit 1 ;;
              missing|pending) sleep 10 ;;
              *) echo "Unexpected Crucible PR monitor state: $state" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for the Crucible PR monitor for $sha." >&2
          exit 1
      - name: Development pushes have no PR monitor dependency
        if: github.event_name == 'push'
        run: echo "Development push - PR monitor aggregation is only enforced on pull requests."
