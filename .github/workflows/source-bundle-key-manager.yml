name: Manage Crucible custody keys

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap missing keys or rotate existing keys
        required: true
        type: choice
        options:
          - bootstrap
          - rotate
        default: bootstrap

permissions:
  contents: write

concurrency:
  group: crucible-key-manager-development
  cancel-in-progress: false

jobs:
  manage:
    if: github.repository == '6076446993/The-Crucible' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: development
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Validate key-manager App credentials are configured
        env:
          KEY_MANAGER_APP_ID: ${{ secrets.CRUCIBLE_KEY_MANAGER_APP_ID || vars.CRUCIBLE_MONITOR_APP_CLIENT_ID }}
          KEY_MANAGER_PRIVATE_KEY: ${{ secrets.CRUCIBLE_KEY_MANAGER_PRIVATE_KEY || secrets.CRUCIBLE_MONITOR_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY_MANAGER_APP_ID" || { echo 'Missing CRUCIBLE_KEY_MANAGER_APP_ID'; exit 1; }
          test -n "$KEY_MANAGER_PRIVATE_KEY" || { echo 'Missing CRUCIBLE_KEY_MANAGER_PRIVATE_KEY'; exit 1; }
          echo 'Key-manager App credentials are configured; values were not displayed.'
      - name: Mint narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.CRUCIBLE_KEY_MANAGER_APP_ID || vars.CRUCIBLE_MONITOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.CRUCIBLE_KEY_MANAGER_PRIVATE_KEY || secrets.CRUCIBLE_MONITOR_APP_PRIVATE_KEY }}
          owner: 6076446993
          repositories: The-Crucible
      - name: Generate or rotate ephemeral custody keys
        env:
          CRUCIBLE_SOURCE_BUNDLE_KEY: ${{ secrets.CRUCIBLE_SOURCE_BUNDLE_KEY }}
          CRUCIBLE_VETTED_BUNDLE_KEY: ${{ secrets.CRUCIBLE_VETTED_BUNDLE_KEY }}
          CRUCIBLE_KEY_MANAGER_BACKEND: github-app
        run: |
          set -euo pipefail
          node src/sourceBundleKeyAutomation.js generate --mode "${{ inputs.mode }}" --output-dir "$RUNNER_TEMP/crucible-key-manager" --registry governingDocuments/source-bundle-key-registry.json
      - name: Store current and previous values without exposing them
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          for secret in CRUCIBLE_SOURCE_BUNDLE_KEY CRUCIBLE_VETTED_BUNDLE_KEY CRUCIBLE_SOURCE_BUNDLE_KEY_PREVIOUS CRUCIBLE_VETTED_BUNDLE_KEY_PREVIOUS; do
            file="$RUNNER_TEMP/crucible-key-manager/$secret"
            if [ -f "$file" ]; then gh secret set "$secret" --repo "$GITHUB_REPOSITORY" < "$file"; fi
          done
      - name: Commit non-secret registry fingerprints
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'Crucible key manager'
          git config user.email 'crucible-key-manager'
          git add governingDocuments/source-bundle-key-registry.json
          git diff --cached --quiet && { echo 'No registry metadata change.'; exit 0; }
          git commit -m 'Update automated custody key fingerprints'
          git push origin HEAD:development
      - name: Retain redacted lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crucible-key-manager-${{ github.run_id }}
          path: ${{ runner.temp }}/crucible-key-manager/key-manager-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Destroy runner key material and credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/crucible-key-manager"
